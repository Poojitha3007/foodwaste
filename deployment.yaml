apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodwaste-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: foodwaste-portal
  template:
    metadata:
      labels:
        app: foodwaste-portal
    spec:
      containers:
        - name: foodwaste-portal
          image: kurellapoojitha/foodwaste:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: foodwaste-portal-service
spec:
  type: NodePort
  selector:
    app: foodwaste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30015
